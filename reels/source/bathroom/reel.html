<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{width:1080px;height:1920px;display:block}</style>
</head><body>
<canvas id="c" width="2160" height="3840"></canvas>
<script>
const W=1080,H=1920,DUR=35;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const COL={bg:'#F5F5F8',ink:'#16163A',indigo:'#2A27B5',lav:'#8C84F2',lav2:'#B8B3F7',lav3:'#DCD9FB',grey:'#E4E4EC',grey2:'#C9C9D6',muted:'#8A8AA0',navy:'#0E0D2E'};
const SERIF='"Instrument Serif", Georgia, serif', SANS='Inter, sans-serif';

/* ---------- helpers ---------- */
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),3);
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eback=t=>{t=clamp(t);const c1=1.5,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const prog=(t,a,b)=>clamp((t-a)/(b-a));
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}

const IC=Math.cos(Math.PI/6),IS=0.5;
let OX=540,OY=900;
function P(x,y,z){return [OX+(x-y)*IC, OY+(x+y)*IS-z];}
function poly(pts,fill,stroke,lw=2){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.stroke();}}
function box(x,y,z,w,d,h,c,stroke=COL.indigo,lw=2){
  poly([P(x+w,y,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x+w,y,z+h)],c.r,stroke,lw);
  poly([P(x,y+d,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x,y+d,z+h)],c.l,stroke,lw);
  poly([P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)],c.t,stroke,lw);
}
const BOXA={t:'#C9C5FA',l:'#8C84F2',r:'#A7A0F6'};
const BOXB={t:'#FFFFFF',l:'#D9D9E6',r:'#EBEBF3'};
const BOXC={t:'#6F66EE',l:'#2A27B5',r:'#4A43D6'};

function txt(s,x,y,size,color,{font=SANS,weight=500,align='center',italic=false,alpha=1,ls=0}={}){
  ctx.save();ctx.globalAlpha*=alpha;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='alphabetic';
  ctx.font=`${italic?'italic ':''}${weight} ${size}px ${font}`;
  if(ls){ctx.letterSpacing=ls+'px';}
  ctx.fillText(s,x,y);ctx.restore();
}

/* rich caption: *word* = accent. Words fade+rise one by one */
function caption(str,t,t0,t1,y=1395){
  if(t<t0-0.05||t>t1+0.35)return;
  const out=1-eo(prog(t,t1,t1+0.3));
  const words=str.split(' ').map(w=>{const em=/^\*.*\*[.,?!]?$/.test(w)||w.startsWith('*')||w.endsWith('*');return{w:w.replace(/\*/g,''),em}});
  // track emphasis spans across words
  let inEm=false;words.forEach(o=>{});
  const raw=str.split(' ');let st=false;
  raw.forEach((r,i)=>{const open=r.startsWith('*');if(open)st=true;words[i].em=st;if(r.replace(/[.,?!]$/,'').endsWith('*'))st=false;});
  const size=58;ctx.font=`italic 400 ${size}px ${SERIF}`;
  const sp=ctx.measureText(' ').width;
  const widths=words.map(o=>ctx.measureText(o.w).width);
  // wrap to max 880
  const lines=[[]];let lw=0;
  words.forEach((o,i)=>{const w=widths[i];if(lw+w>880&&lines[lines.length-1].length){lines.push([]);lw=0;}lines[lines.length-1].push(i);lw+=w+sp;});
  lines.forEach((ln,li)=>{
    const tw=ln.reduce((s,i)=>s+widths[i],0)+sp*(ln.length-1);
    let x=540-tw/2;const yy=y+li*70-(lines.length-1)*35;
    ln.forEach(i=>{
      const a=eo(prog(t,t0+i*0.07,t0+i*0.07+0.35));
      ctx.save();ctx.globalAlpha=a*out;ctx.font=`italic 400 ${size}px ${SERIF}`;ctx.fillStyle=words[i].em?COL.lav:COL.ink;ctx.textBaseline='alphabetic';
      ctx.fillText(words[i].w,x,yy+(1-a)*14);ctx.restore();
      x+=widths[i]+sp;
    });
  });
}

function sceneAlpha(t,a,b,fi=0.35,fo=0.35){return Math.min(eo(prog(t,a,a+fi)),1-eo(prog(t,b-fo,b)));}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ---------- bathroom scenes ---------- */
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
function quad(a,b,c,d,fill,stroke,lw=1.6){poly([a,b,c,d],fill,stroke,lw);}

// Room: 5ft (x) × 8ft (y) × 8ft high. u = px per ft.
function room(o){
  const {u=52,ox=610,oy=900,floor=0,wallA=0,wallB=0,dims=0,ghost=1,fix=0,hlFloor=0}=o;
  OX=ox;OY=oy;const X=5*u,Y=8*u,Z=8*u,g=2;
  // back walls (x=0 plane and y=0 plane) base
  quad(P(0,0,0),P(0,Y,0),P(0,Y,Z),P(0,0,Z),'#FFFFFF',COL.grey2,2);
  quad(P(0,0,0),P(X,0,0),P(X,0,Z),P(0,0,Z),'#F0F0F6',COL.grey2,2);
  quad(P(0,0,0),P(X,0,0),P(X,Y,0),P(0,Y,0),'#FAFAFD',COL.grey2,2);
  // wall A tiles (x=0): 8 cols (y) × 8 rows (z), filled bottom-up
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const a=clamp(wallA*8*1.0-(r+c*0.06));if(a<=0)continue;
    ctx.save();ctx.globalAlpha*=clamp(a*1.5);
    const y0=c*u+g,y1=(c+1)*u-g,z0=r*u+g,z1=(r+1)*u-g;
    quad(P(0,y0,z0),P(0,y1,z0),P(0,y1,z1),P(0,y0,z1),'#E4E1FC',COL.lav,1.4);ctx.restore();}
  for(let r=0;r<8;r++)for(let c=0;c<5;c++){
    const a=clamp(wallB*8-(r+c*0.06));if(a<=0)continue;
    ctx.save();ctx.globalAlpha*=clamp(a*1.5);
    const x0=c*u+g,x1=(c+1)*u-g,z0=r*u+g,z1=(r+1)*u-g;
    quad(P(x0,0,z0),P(x1,0,z0),P(x1,0,z1),P(x0,0,z1),'#D3CFFA',COL.lav,1.4);ctx.restore();}
  // floor tiles
  for(let i=0;i<5;i++)for(let j=0;j<8;j++){
    const a=clamp(floor*6-(i+j)*0.45);if(a<=0)continue;
    ctx.save();ctx.globalAlpha*=clamp(a);
    const x0=i*u+g,x1=(i+1)*u-g,y0=j*u+g,y1=(j+1)*u-g;
    quad(P(x0,y0,0),P(x1,y0,0),P(x1,y1,0),P(x0,y1,0),hlFloor?COL.lav2:'#C9C5FA',COL.indigo,1.4);ctx.restore();}
  // top rims (thick indigo like reference)
  ctx.strokeStyle=COL.indigo;ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();
  ctx.moveTo(...P(0,Y,Z));ctx.lineTo(...P(0,0,Z));ctx.lineTo(...P(X,0,Z));ctx.stroke();
  ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(...P(0,0,0));ctx.lineTo(...P(0,0,Z));ctx.stroke();
  // fixtures
  if(fix>0){ctx.save();ctx.globalAlpha*=fix;
    // mirror on wall B
    quad(P(u*1.2,0,u*4.2),P(u*3.2,0,u*4.2),P(u*3.2,0,u*6.4),P(u*1.2,0,u*6.4),'#EEF0FF',COL.indigo,2.4);
    // vanity
    box(u*1.0,0,u*2.6,u*2.4,u*1.3,u*0.5,BOXB,COL.indigo,2.2);
    box(u*1.15,0,0,u*2.1,u*1.1,u*2.6,BOXB,COL.indigo,2.2);
    // shower glass panel on wall A side
    ctx.globalAlpha*=0.9;quad(P(u*2.6,u*5.2,0),P(u*2.6,u*8,0),P(u*2.6,u*8,u*7),P(u*2.6,u*5.2,u*7),'rgba(140,132,242,0.12)',COL.indigo,2.6);
    ctx.globalAlpha=ctx.globalAlpha/0.9;
    // shower head
    ctx.strokeStyle=COL.indigo;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(...P(0,u*6.6,u*6.6));ctx.lineTo(...P(u*0.6,u*6.6,u*6.6));ctx.stroke();
    ctx.beginPath();ctx.ellipse(...P(u*0.7,u*6.6,u*6.5),14,7,0,0,Math.PI*2);ctx.fillStyle=COL.indigo;ctx.fill();
    // toilet
    box(u*0.0,u*3.2,0,u*0.5,u*1.3,u*2.2,BOXB,COL.indigo,2.2);
    box(u*0.5,u*3.35,0,u*1.4,u*1.0,u*1.1,BOXB,COL.indigo,2.2);
    ctx.restore();}
  // ghost front walls
  if(ghost>0){ctx.save();ctx.globalAlpha*=ghost*0.8;ctx.setLineDash([10,10]);ctx.strokeStyle=COL.grey2;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(...P(X,0,Z));ctx.lineTo(...P(X,Y,Z));ctx.lineTo(...P(0,Y,Z));
    ctx.moveTo(...P(X,Y,0));ctx.lineTo(...P(X,Y,Z));ctx.moveTo(...P(X,0,0));ctx.lineTo(...P(X,0,Z));ctx.moveTo(...P(0,Y,0));ctx.lineTo(...P(0,Y,Z));ctx.stroke();ctx.restore();}
  // dimensions
  if(dims>0){ctx.save();ctx.globalAlpha*=dims;
    const lab=(a,b,s,dx,dy)=>{ctx.strokeStyle=COL.lav;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(a[0]+dx,a[1]+dy);ctx.lineTo(b[0]+dx,b[1]+dy);ctx.stroke();
      [a,b].forEach(p=>{ctx.beginPath();ctx.arc(p[0]+dx,p[1]+dy,6,0,7);ctx.fillStyle=COL.lav;ctx.fill();});
      txt(s,(a[0]+b[0])/2+dx*2.2,(a[1]+b[1])/2+dy*2.2+12,34,COL.indigo,{weight:600});};
    lab(P(0,Y,0),P(X,Y,0),'5 ft',-26,34);
    lab(P(X,0,0),P(X,Y,0),'8 ft',30,30);
    ctx.restore();}
}

// S1 0–4.6 hook
function s1(t){
  const A=sceneAlpha(t,0,4.6,0.01);if(A<=0)return;ctx.save();ctx.globalAlpha=A;
  const b=eo(prog(t,0,0.9));
  ctx.save();ctx.translate(0,(1-b)*40);
  room({fix:eo(prog(t,0.5,1.4)),ghost:b});
  ctx.restore();
  const q=eback(prog(t,2.0,2.6));
  ctx.save();ctx.globalAlpha*=clamp(q);
  txt('?',490,380-Math.sin(t*2.2)*8,190,COL.lav,{font:SERIF,italic:true,weight:400});
  txt('cost of tiling',560,300,30,COL.muted,{align:'left',weight:400});ctx.restore();
  ctx.restore();
  caption('Your client asks: *“What will the tiles cost?”*',t,0.3,4.4);
}

// S2 4.6–9.2 floor-only guess
function s2(t){
  const A=sceneAlpha(t,4.6,9.2);if(A<=0)return;ctx.save();ctx.globalAlpha=A;
  room({floor:prog(t,5.0,6.4),dims:eo(prog(t,5.6,6.2)),fix:1-eo(prog(t,4.6,5.2)),hlFloor:1});
  const a1=eo(prog(t,6.2,6.7)),a2=eo(prog(t,7.3,7.8));
  txt('40',520,380,150,COL.ink,{weight:600,align:'right',alpha:a1,ls:-4});
  txt('sq ft',535,345,40,COL.lav,{align:'left',alpha:a1});
  txt('5 ft × 8 ft floor',535,382,28,COL.muted,{align:'left',weight:400,alpha:a1});
  txt('× ₹80  =  ₹3,200',540,470,52,COL.indigo,{weight:600,alpha:a2});
  ctx.restore();
  caption('Most people measure *just the floor.*',t,4.9,9.0);
}

// S3 9.2–13.4 walls too
function s3(t){
  const A=sceneAlpha(t,9.2,13.4);if(A<=0)return;ctx.save();ctx.globalAlpha=A;
  const wa=eio(prog(t,9.6,11.6)),wb=eio(prog(t,10.0,12.0));
  room({floor:1,wallA:wa,wallB:wb,ghost:1});
  const area=40+64*2*wa+40*2*wb;
  txt(String(Math.round(area)),520,380,150,COL.ink,{weight:600,align:'right',ls:-4});
  txt('sq ft',535,345,40,COL.lav,{align:'left'});
  txt('floor + all 4 walls',535,382,28,COL.muted,{align:'left',weight:400});
  ctx.restore();
  caption('But the *walls* get tiled too, *floor to ceiling.*',t,9.5,13.2);
}

// S4+S5 13.4–21 unfolded net, ≈6×, then +10% wastage
function s4(t){
  const A=sceneAlpha(t,13.4,21.0);if(A<=0)return;ctx.save();ctx.globalAlpha=A;
  const cx=540,cy=880,u=26;
  const fw=5*u,fd=8*u,h=8*u;
  const panels=[
    {x:-fw/2,y:-fd/2,w:fw,h:fd,lab:'40',k:0,floor:true},
    {x:-fw/2,y:-fd/2-h,w:fw,h:h,lab:'40',k:1},
    {x:-fw/2,y:fd/2,w:fw,h:h,lab:'40',k:2},
    {x:-fw/2-h,y:-fd/2,w:h,h:fd,lab:'64',k:3},
    {x:fw/2,y:-fd/2,w:h,h:fd,lab:'64',k:4}];
  panels.forEach(p=>{
    const a=p.k===0?eo(prog(t,13.5,14.0)):eback(prog(t,13.9+p.k*0.2,14.6+p.k*0.2));if(a<=0)return;
    ctx.save();ctx.globalAlpha*=clamp(a);
    // slide out from floor
    const dx=p.k===3?(1-a)*h:p.k===4?-(1-a)*h:0,dy=p.k===1?(1-a)*h:p.k===2?-(1-a)*h:0;
    const x=cx+p.x+dx,y=cy+p.y+dy;
    ctx.fillStyle=p.floor?COL.lav2:'#E4E1FC';ctx.fillRect(x,y,p.w,p.h);
    ctx.strokeStyle=COL.lav;ctx.lineWidth=1.2;
    for(let gx=x+u;gx<x+p.w-1;gx+=u){ctx.beginPath();ctx.moveTo(gx,y);ctx.lineTo(gx,y+p.h);ctx.stroke();}
    for(let gy=y+u;gy<y+p.h-1;gy+=u){ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(x+p.w,gy);ctx.stroke();}
    ctx.strokeStyle=COL.indigo;ctx.lineWidth=2.4;ctx.strokeRect(x,y,p.w,p.h);
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+p.w/2,y+p.h/2,30,0,7);ctx.fill();ctx.strokeStyle=COL.indigo;ctx.lineWidth=2;ctx.stroke();
    txt(p.lab,x+p.w/2,y+p.h/2+10,26,COL.indigo,{weight:600});
    ctx.restore();});
  // wastage shards
  const wst=prog(t,17.4,18.6);
  if(wst>0){for(let i=0;i<22;i++){
    const a=eback(clamp(wst*1.6-i*0.03));if(a<=0)continue;
    const ang=rnd(i*3)*Math.PI*2,rad=330+rnd(i*5)*90;
    const px=cx+Math.cos(ang)*rad*0.85,py=cy+Math.sin(ang)*rad*1.05;
    ctx.save();ctx.globalAlpha*=clamp(a);ctx.translate(lerp(cx,px,a),lerp(cy,py,a));ctx.rotate(rnd(i)*3+t*0.3*(rnd(i+9)-.5));
    const s=14+rnd(i*11)*18;
    ctx.beginPath();ctx.moveTo(-s,-s*0.6);ctx.lineTo(s*0.8,-s);ctx.lineTo(s,s*0.5);ctx.lineTo(-s*0.4,s*0.9);ctx.closePath();
    ctx.fillStyle=COL.lav2;ctx.fill();ctx.strokeStyle=COL.indigo;ctx.lineWidth=1.6;ctx.stroke();ctx.restore();}}
  // header
  const h1=eo(prog(t,15.2,15.7)),h2=eo(prog(t,17.3,17.8));
  ctx.save();ctx.globalAlpha*=h1*(1-h2);
  txt('≈ 6×',520,380,150,COL.ink,{weight:600,align:'right',ls:-4});
  txt('the floor',535,345,40,COL.lav,{align:'left'});
  txt('248 sq ft in total',535,382,28,COL.muted,{align:'left',weight:400});
  ctx.restore();
  ctx.save();ctx.globalAlpha*=h2;
  const v=Math.round(lerp(248,273,eio(prog(t,17.6,18.8))));
  txt(String(v),520,380,150,COL.ink,{weight:600,align:'right',ls:-4});
  txt('sq ft',535,345,40,COL.lav,{align:'left'});
  txt('+10% wastage',535,382,28,COL.muted,{align:'left',weight:400});
  ctx.restore();
  ctx.restore();
  caption('Unfold it: that’s *≈ 6× the floor area.*',t,13.7,17.1);
  caption('Add *10%* for cuts and breakage.',t,17.4,20.8);
}

// S6 21–26 rates: tile + labour & material
function s6(t){
  const A=sceneAlpha(t,21.0,26.2);if(A<=0)return;ctx.save();ctx.globalAlpha=A;
  OX=540;OY=930;
  const la=eo(prog(t,23.4,24.2));
  // bed layers
  for(let i=2;i>=0;i--){const a=eback(prog(t,23.4+i*0.15,23.9+i*0.15));if(a<=0)continue;
    ctx.save();ctx.globalAlpha*=clamp(a);box(-170,-170,-60+i*16+(1-a)*-40,340,340,10,i===2?{t:'#ECEBFE',l:'#B8B3F7',r:'#CFCBFA'}:{t:'#F4F4F8',l:'#C9C9D6',r:'#DEDEE8'},COL.indigo,1.8);ctx.restore();}
  const ta=eback(prog(t,21.3,22.0));
  ctx.save();ctx.globalAlpha*=clamp(ta);
  const lift=la*40;
  box(-170,-170,(1-ta)*200+lift,340,340,24,BOXA,COL.indigo,2.6);
  ctx.restore();
  const a1=eo(prog(t,21.8,22.3));
  txt('₹80',520,390,140,COL.ink,{weight:600,align:'right',alpha:a1,ls:-3});
  txt('/ sq ft',535,345,36,COL.lav,{align:'left',alpha:a1});
  txt('tile rate',535,385,28,COL.muted,{align:'left',weight:400,alpha:a1});
  txt('+ ₹45',520,520,110,COL.lav,{weight:600,align:'right',alpha:la,ls:-3});
  txt('labour, adhesive',535,480,30,COL.muted,{align:'left',weight:400,alpha:la});
  txt('& grout / sq ft',535,518,30,COL.muted,{align:'left',weight:400,alpha:la});
  ctx.restore();
  caption('Tile at *₹80* a square foot...',t,21.3,23.2);
  caption('plus *₹45* for labour, adhesive and grout.',t,23.4,26.0);
}

// S7 26.2–30.4 the real number
function s7(t){
  const A=sceneAlpha(t,26.2,30.6);if(A<=0)return;ctx.save();ctx.globalAlpha=A;
  const ra=eo(prog(t,26.3,26.9));
  ctx.save();ctx.globalAlpha*=ra;room({u:34,ox:575,oy:900,floor:1,wallA:1,wallB:1,ghost:1});ctx.restore();
  txt('(₹80 + ₹45) × 273 sq ft',540,300,44,COL.muted,{weight:500,alpha:eo(prog(t,26.4,26.9))});
  const v=lerp(0,34125,eio(prog(t,26.9,28.2)));
  txt(inr(v),540,450,150,COL.indigo,{weight:600,ls:-5,alpha:eo(prog(t,26.8,27.2))});
  // struck guess
  const ga=eo(prog(t,28.4,28.9));
  ctx.save();ctx.globalAlpha*=ga;
  txt('₹3,200',540,1220,60,COL.muted,{weight:500});
  const sw=eo(prog(t,28.8,29.3));ctx.strokeStyle='#E5484D';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(445,1200);ctx.lineTo(445+190*sw,1200);ctx.stroke();
  txt('floor-only guess',540,1262,26,COL.muted,{weight:400});
  ctx.restore();
  ctx.restore();
  caption('Not ₹3,200. *More than 10× that.*',t,28.4,30.4);
}

// S8 30.4–35 CTA
function s8(t){
  const p=eio(prog(t,30.4,31.1));if(p<=0)return;
  ctx.save();const top=H*(1-p);
  const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#0E0D2E');gr.addColorStop(0.7,'#15134A');gr.addColorStop(1,'#2A2780');
  ctx.fillStyle=gr;ctx.fillRect(0,top,W,H);ctx.translate(0,top+90);
  const a=k=>eo(prog(t,30.9+k*0.12,31.4+k*0.12));
  txt('BATHROOM ESTIMATES · DONE RIGHT',80,330,24,COL.lav2,{align:'left',weight:600,ls:4,alpha:a(0)});
  txt('Quote the',80,470,112,'#FFFFFF',{align:'left',weight:300,ls:-3,alpha:a(1)});
  txt('whole bathroom,',80,590,112,'#FFFFFF',{align:'left',weight:300,ls:-3,alpha:a(2)});
  txt('not just the floor.',80,710,104,COL.lav,{align:'left',font:SERIF,italic:true,weight:400,alpha:a(3)});
  const feats=[['Every face','floor + 4 walls, measured'],['Wastage','10% for cuts, built in'],['Itemised','tile, labour & material']];
