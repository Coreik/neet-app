<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:D;src:url(fonts/InterDisplay-SemiBold.otf);font-weight:600}
@font-face{font-family:D;src:url(fonts/InterDisplay-Bold.otf);font-weight:700}
@font-face{font-family:T;src:url(fonts/Inter-Medium.otf);font-weight:500}
@font-face{font-family:T;src:url(fonts/Inter-SemiBold.otf);font-weight:600}
@font-face{font-family:T;src:url(fonts/Inter-Bold.otf);font-weight:700}
:root{--ink:#1D1D1F;--grey:#86868B;--tile:#F5F5F7;--blue:#2B6A9E;--red:#D93B3B}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#fff;overflow:hidden}
body{font-family:T,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#c{position:relative;overflow:hidden;background:#fff}
.abs{position:absolute}
.h{font-family:D;font-weight:700;letter-spacing:-.035em;line-height:1.04}
.g{background:linear-gradient(100deg,#9CCBEA 0%,#5A9BD0 45%,#2B6A9E 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .04em;margin:0 -.04em}
.logo{position:absolute;left:72px;top:64px;font:600 34px D;letter-spacing:-.01em}
.pg{position:absolute;right:72px;top:68px;font:600 26px T;color:var(--grey)}
.foot{position:absolute;left:72px;right:72px;bottom:60px;display:flex;justify-content:space-between;font:600 26px T;color:var(--grey)}
.tile{position:absolute;border-radius:40px;background:var(--tile);overflow:hidden}
.cover{position:absolute;inset:0;background-size:cover;background-position:center}
.frame{position:absolute;overflow:hidden;border-radius:44px;box-shadow:0 2px 6px rgba(0,0,0,.05),0 24px 50px rgba(0,0,0,.10),0 60px 120px rgba(0,0,0,.10)}
.pill{display:inline-block;background:rgba(255,255,255,.9);border-radius:999px;padding:14px 28px;font:600 30px T}
.opt{position:absolute;left:90px;right:90px;height:150px;border-radius:40px;background:var(--tile);display:flex;align-items:center;gap:30px;padding:0 44px;font:600 50px D;letter-spacing:-.02em}
.opt span{font-size:60px}
</style></head><body><div id="c"></div>
<script>
const W=1080,H=1350;
const logo='<div class="logo">Corebath <span style="font:600 24px T;color:var(--grey)">by Corespace</span></div>';
const ph=(f,top,h,extra='')=>`<div class="frame" style="left:72px;top:${top}px;width:936px;height:${h}px;border-radius:40px"><div class="cover" style="background-image:url(img3/${f}.jpg)"></div>${extra}</div>`;
const tag=t=>`<div class="abs" style="left:24px;bottom:24px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:10px 22px;font:600 24px T">${t}</div>`;
const sign=(n,f,t,sub,pg,extra='')=>`${logo}<div class="pg">${pg}</div>${ph(f,150,720,extra)}
 <div class="abs h g" style="left:68px;top:905px;font-size:140px;letter-spacing:-.05em">${n}</div>
 <div class="abs h" style="left:290px;right:60px;top:920px;font-size:66px">${t}</div>
 <div class="abs" style="left:292px;right:72px;top:${t.includes('<br>')?1080:1010}px;font:600 36px D;color:var(--grey);letter-spacing:-.015em;line-height:1.3">${sub}</div>`;
const P={
'L-0':`${logo}<div class="pg">1/7</div>
 <div class="abs h" style="left:72px;right:60px;top:170px;font-size:108px">5 signs your<br>bathroom is <span class="g">leaking.</span></div>
 <div class="abs" style="left:74px;top:420px;font:600 44px D;color:var(--grey);letter-spacing:-.02em">Before you ever see a drip.</div>
 ${ph('leak',540,640,tag('Real footage'))}
 <div class="foot"><span>Swipe →</span><span>Save for later 🔖</span></div>`,
'L-1':sign('01','r1','Damp patches<br>on the wall.','Outside the bathroom = water travelling behind your tiles.','2/7'),
'L-2':sign('02','r3','Grout that<br>never dries.','Dark, stained grout means the bed underneath is wet.','3/7'),
'L-3':sign('03','r5','Tiles that<br>sound hollow.','Tap them. A hollow sound means the adhesive has let go.','4/7',
  `<div class="abs" style="right:26px;bottom:26px;width:330px;height:230px;border-radius:24px;overflow:hidden;border:5px solid #fff;box-shadow:0 10px 30px rgba(0,0,0,.25)"><div class="cover" style="background-image:url(img3/r4.jpg)"></div>
   <div class="abs" style="left:12px;top:12px;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 14px;font:700 20px T">What's underneath</div></div>`),
'L-4':sign('04','r2','Stains on the<br>ceiling below.','In apartments, your downstairs neighbour usually notices first.','5/7'),
'L-5':sign('05','mould','A smell that<br>won\'t go away.','Mould grows where moisture hides.','6/7'),
'L-6':`${logo}<div class="pg">7/7</div>${ph('wp',150,640,tag('Real Corespace site'))}
 <div class="abs h" style="left:72px;right:60px;top:830px;font-size:62px;color:var(--grey)">Spotted two or more?</div>
 <div class="abs h" style="left:72px;right:60px;top:900px;font-size:74px"><span class="g">It's a waterproofing problem,</span><br>not a tile problem.</div>
 <div class="abs" style="left:74px;right:72px;top:1110px;font:600 36px D;color:var(--grey);letter-spacing:-.015em">We waterproof before a single tile goes down.</div>`,
};
window.KEYS=Object.keys(P);
window.show=k=>{const c=document.getElementById('c');c.style.width=W+'px';c.style.height=H+'px';c.innerHTML=P[k];return [W,H]};
window.ready=Promise.all([document.fonts.ready,...['r1','r2','r3','r4','r5','wp','leak','mould'].map(n=>new Promise(r=>{const im=new Image();im.onload=im.onerror=r;im.src=`img3/${n}.jpg`}))]);
</script></body></html>
